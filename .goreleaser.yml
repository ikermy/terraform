version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: provider
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: zip
    files:
      - none*

checksum:
  name_template: "{{ .ProjectName }}_sha256sums.txt"

# Terraform provider registry (registry.terraform.io) считывает checksums.
release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
